<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Forms</title>
</head>
<body>
 <form action="" method="post" name="registration">
 <p>
 1. Patient name : 
 <input type="text" name="Patientname" value="Enter patient name here" maxlength="30" />
 </p>
 <p>
 
 2. Age: 
 <input type="age" name="age" value="enter patient age here" maxlength="3" />
 </p>
 <p>

3. Please select patient gender: 
 <br/>
 <input type="radio" name="patient gender" id="" value="Male" checked="checked"> Male
 <input type="radio" name="patient gender" id="" value="Female" > Female
 </p>
 <p>
    
 4. Id number: 
 <input type="text" name="Id number" value="Enter the Id number" maxlength="15" />
 </p>
 <p>
 
 5. Phone Number:
 <input type= "text" name="phone Number" value="Enter phone number" maxlength="10"/>
 </p>
 <p>
     
 6. Health status:
 <br />
 <input type="checkbox" name="service" value="health" checked="checked" /> Health<br />
 <input type="checkbox" name="service" value="Acute illness" /> Acute illness<br />
 <input type="checkbox" name="service" value="Chronic illness" />Chronic illness<br />
 <input type="checkbox" name="service" value="Recovering" />Recovering<br />
 </p>
 
 7. Maritual status: 
 <br/>
 <input type="radio" name="status" id="" value="single" checked="checked"> Single
 <input type="radio" name="status" id="" value="Maried" > Maried
 </p>
 <p>
 
 8. Next on kin: 
 <input type="text" name="Next on kin" value="enter the name here" maxlength="30" />
 </p>
 <p>
 
 9. Weight: 
 <input type="text" name="Weight" value="enter the weight " maxlength="3" />
 </p>
 <p>
 
 10. Patient Id: 
 <input type="text" name="Patient Id" value="enter patient Id here" maxlength="30" />
 </p>
 <p> 
  </form>
</body>
</html>
